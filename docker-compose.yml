services:
  db:
    image: postgres:17-alpine
    container_name: homely-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: homely
      POSTGRES_PASSWORD: homely
      POSTGRES_DB: homely
    ports:
      - '5433:5432'
    volumes:
      - homely-pgdata:/var/lib/postgresql/data
      - ./server/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homely -d homely']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  homely-pgdata:
